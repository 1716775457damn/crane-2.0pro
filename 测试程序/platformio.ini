# PlatformIO Project Configuration
# ESP32-S3 Enhanced Robot Control System
# Optimized for performance, debugging, and enhanced features

[platformio]
default_envs = esp32s3_optimized

# Production Environment - Optimized for Performance
[env:esp32s3_optimized]
platform = espressif32@^6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters =
    direct
    esp32_exception_decoder
    time
monitor_rts = 0
monitor_dtr = 0

# Flash and Memory Configuration
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.psram = enabled
board_build.arduino.memory_type = qio_opi

# Optimized Build Flags for Performance
build_flags =
    ; USB and Debug Configuration
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2

    ; Performance Optimizations
    -O2
    -DCONFIG_ARDUHAL_LOG_DEFAULT_LEVEL=2
    -DCONFIG_LOG_DEFAULT_LEVEL=2

    ; Memory Optimizations
    -DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1
    -DCONFIG_ESP32S3_SPIRAM_SUPPORT=1
    -DBOARD_HAS_PSRAM

    ; WiFi and Network Optimizations
    -DCONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=16
    -DCONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=32
    -DCONFIG_ESP32_WIFI_TX_BUFFER_TYPE=1
    -DCONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=32

    ; Web Server Optimizations
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    -DCONFIG_ASYNC_TCP_PRIORITY=10

    ; System Optimizations
    -DCONFIG_FREERTOS_HZ=1000
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=30
    -DCONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0=0
    -DCONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1=0

    ; Enhanced Features Flags
    -DENHANCED_CHASSIS_CONTROL=1
    -DVIRTUAL_JOYSTICK_SUPPORT=1
    -DSAFETY_MONITORING=1
    -DREAL_TIME_STATUS=1

# Optimized Library Dependencies
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^6.21.5
    ; ESP32 built-in libraries (no external dependencies needed)

# Development Environment - Enhanced Debugging
[env:esp32s3_debug]
platform = espressif32@^6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters =
    direct
    esp32_exception_decoder
    time
    log2file
debug_tool = esp-builtin
debug_init_break = tbreak setup

# Debug-specific Flash Configuration
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
board_build.psram = enabled

# Debug Build Flags
build_flags =
    ; USB and Debug Configuration
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=5

    ; Debug Optimizations
    -Og
    -g3
    -ggdb
    -DDEBUG=1
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_CORE
    -DDEBUG_ESP_WIFI
    -DDEBUG_ESP_HTTP_SERVER

    ; Memory Debug
    -DCONFIG_HEAP_POISONING_COMPREHENSIVE=1
    -DCONFIG_HEAP_TRACING=1

    ; Enhanced Features Debug Flags
    -DENHANCED_CHASSIS_CONTROL=1
    -DVIRTUAL_JOYSTICK_SUPPORT=1
    -DSAFETY_MONITORING=1
    -DREAL_TIME_STATUS=1
    -DDEBUG_CHASSIS_CONTROL=1
    -DDEBUG_SAFETY_SYSTEM=1
    -DDEBUG_WEB_INTERFACE=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^6.21.5

# Testing Environment - Unit Testing Support
[env:esp32s3_test]
platform = espressif32@^6.4.0
board = esp32-s3-devkitc-1
framework = arduino
test_framework = unity
test_build_src = yes
monitor_speed = 115200

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = huge_app.csv
board_build.psram = enabled

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DUNIT_TEST=1
    -DTEST_MODE=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^6.21.5